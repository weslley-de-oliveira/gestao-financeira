name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela execuções anteriores da mesma branch/PR quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Os hooks do Husky são apenas para uso local.
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build
