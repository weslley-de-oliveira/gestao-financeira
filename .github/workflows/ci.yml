name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Cancela execuções anteriores da mesma branch/PR quando um novo push chega.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Format, lint, test e build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Os hooks do Husky são apenas para uso local.
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      # Falha também se a cobertura cair abaixo dos limites do angular.json.
      - name: Unit tests with coverage
        run: npm run test:coverage

      - name: Coverage summary
        if: ${{ !cancelled() && hashFiles('coverage/gestao-financeira/coverage-summary.json') != '' }}
        run: |
          node -e "
            const total = require('./coverage/gestao-financeira/coverage-summary.json').total;
            const names = { statements: 'Instruções', branches: 'Ramos', functions: 'Funções', lines: 'Linhas' };
            const rows = Object.entries(names).map(
              ([key, name]) => '| ' + name + ' | ' + total[key].pct + '% | ' + total[key].covered + '/' + total[key].total + ' |',
            );
            console.log(['### Cobertura dos testes unitários', '', '| Métrica | % | Cobertos |', '| --- | ---: | ---: |', ...rows].join('\n'));
          " >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: npm run build

  e2e:
    name: E2E e acessibilidade (Playwright + axe)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      # Roda contra a build de demo (dados no localStorage), servida pelo próprio Playwright.
      - name: E2E and accessibility tests
        run: npm run e2e

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  e2e-api:
    name: E2E contra a API real (Playwright + Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      HUSKY: 0
      # A API é clonada nesta pasta; o Playwright a inicia a partir do código-fonte.
      API_DIR: api
      DATABASE_URL: postgres://gestao:gestao@localhost:5433/gestao_financeira

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: gestao
          POSTGRES_PASSWORD: gestao
          POSTGRES_DB: gestao_financeira
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U gestao -d gestao_financeira"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Checkout API
        uses: actions/checkout@v7
        with:
          repository: weslley-de-oliveira/gestao-financeira-api
          path: api

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: |
            package-lock.json
            api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install API dependencies
        run: npm ci
        working-directory: api

      # Banco vazio a cada execução: migrações e a conta de demonstração do seed.
      - name: Migrate and seed the database
        run: npm run db:migrate && npm run db:seed
        working-directory: api

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests against the API
        run: npm run e2e:api

      - name: Upload Playwright report
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-api
          path: playwright-report-api/
          retention-days: 7
