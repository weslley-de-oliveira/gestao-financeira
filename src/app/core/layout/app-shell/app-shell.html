<mat-sidenav-container class="shell">
  <mat-sidenav
    class="shell__sidenav"
    [mode]="isMobile() ? 'over' : 'side'"
    [opened]="!isMobile()"
    [fixedInViewport]="isMobile()"
  >
    <a class="shell__brand" routerLink="/dashboard" (click)="closeSidenavOnMobile()">
      <span class="shell__logo" aria-hidden="true">
        <mat-icon>account_balance_wallet</mat-icon>
      </span>
      <span>{{ appName }}</span>
    </a>

    <nav class="shell__nav" aria-label="Navegação principal">
      @for (group of navigationGroups; track group.label) {
        <mat-nav-list class="shell__group">
          <h2 matSubheader class="shell__group-label">{{ group.label }}</h2>
          @for (item of group.items; track item.path) {
            <a
              mat-list-item
              class="shell__link"
              [routerLink]="item.path"
              routerLinkActive="shell__link--active"
              #link="routerLinkActive"
              ariaCurrentWhenActive="page"
              [activated]="link.isActive"
              (click)="closeSidenavOnMobile()"
            >
              <mat-icon matListItemIcon aria-hidden="true">{{ item.icon }}</mat-icon>
              <span matListItemTitle>{{ item.label }}</span>
            </a>
          }
        </mat-nav-list>
      }
    </nav>

    <p class="shell__footer">
      <mat-icon aria-hidden="true">science</mat-icon>
      Ambiente demonstrativo com dados fictícios
    </p>
  </mat-sidenav>

  <mat-sidenav-content class="shell__content">
    <app-topbar (menuToggle)="toggleSidenav()" />
    <main class="shell__main">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
