<mat-toolbar class="topbar">
  <button
    matIconButton
    type="button"
    aria-label="Alternar menu lateral"
    (click)="menuToggle.emit()"
  >
    <mat-icon>menu</mat-icon>
  </button>
  <span class="topbar__title">{{ pageTitle() }}</span>

  <span class="topbar__spacer"></span>

  <mat-form-field class="topbar__period" appearance="outline" subscriptSizing="dynamic">
    <mat-label>Período</mat-label>
    <mat-select [value]="selectedPeriod()" (valueChange)="onPeriodChange($event)">
      @for (option of periodOptions; track option.value) {
        <mat-option [value]="option.value">{{ option.label }}</mat-option>
      }
    </mat-select>
  </mat-form-field>

  <button matIconButton type="button" aria-label="Cor de destaque" [matMenuTriggerFor]="accentMenu">
    <mat-icon>palette</mat-icon>
  </button>

  <button
    matIconButton
    type="button"
    [attr.aria-label]="isDark() ? 'Usar tema claro' : 'Usar tema escuro'"
    (click)="toggleTheme()"
  >
    <mat-icon>{{ isDark() ? 'light_mode' : 'dark_mode' }}</mat-icon>
  </button>

  <button
    type="button"
    class="topbar__avatar"
    [attr.aria-label]="initials() + ', menu do usuário'"
    [matMenuTriggerFor]="userMenu"
  >
    {{ initials() }}
  </button>
</mat-toolbar>

<mat-menu #accentMenu="matMenu" xPosition="before" class="topbar__accent-menu">
  <p class="topbar__menu-heading">Cor de destaque</p>
  @for (option of accentOptions; track option.value) {
    <button
      mat-menu-item
      type="button"
      role="menuitemradio"
      [attr.aria-checked]="accent() === option.value"
      (click)="setAccent(option.value)"
    >
      <span class="topbar__swatch" [style.background]="option.swatch" aria-hidden="true"></span>
      <span>{{ option.label }}</span>
      @if (accent() === option.value) {
        <mat-icon class="topbar__check" aria-hidden="true">check</mat-icon>
      }
    </button>
  }
</mat-menu>

<mat-menu #userMenu="matMenu" xPosition="before">
  @if (currentUser(); as user) {
    <div class="topbar__menu-label">
      <span class="topbar__user-name">{{ user.name }}</span>
      <span class="topbar__user-email">{{ user.email }}</span>
    </div>
  }
  <mat-divider />
  <a mat-menu-item routerLink="/settings">
    <mat-icon>settings</mat-icon>
    <span>Configurações</span>
  </a>
  <a mat-menu-item routerLink="/security">
    <mat-icon>shield_lock</mat-icon>
    <span>Segurança</span>
  </a>
  <mat-divider />
  <button mat-menu-item type="button" (click)="logout()">
    <mat-icon>logout</mat-icon>
    <span>Sair</span>
  </button>
</mat-menu>
